name: Release · Android

# Builds an Android APK and/or Play app bundle. Run from the Actions tab.
#   - apk → a single installable .apk (for Diawi / direct install / testing)
#   - aab → the Play Store app bundle (.aab; NOT installable directly / on Diawi)
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flutter flavor"
        type: choice
        default: prod
        options: [prod, staging, dev]
      format:
        description: "Output (apk = Diawi/install, aab = Play Store)"
        type: choice
        default: apk
        options: [apk, aab, both]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # google-services.json is committed; only the keystore is injected. When
      # no keystore secret is set, this step is skipped and the Gradle config
      # falls back to the debug key, so the pipeline still builds (the AAB is
      # NOT Play-uploadable until the ANDROID_* secrets are added).
      - name: Write keystore + key.properties (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building with the debug key (not Play-uploadable). Add the ANDROID_* secrets to produce a signed bundle."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      # APK — a single installable file for Diawi / direct install.
      - name: Build APK
        if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: >
          flutter build apk --release
          --flavor "$FLAVOR"
          -t "lib/main_$FLAVOR.dart"
          --dart-define-from-file="config/$FLAVOR.json"

      - name: Upload APK
        if: ${{ inputs.format == 'apk' || inputs.format == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.flavor }}
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

      # AAB — Play Store app bundle (not installable directly / on Diawi).
      - name: Build app bundle
        if: ${{ inputs.format == 'aab' || inputs.format == 'both' }}
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: >
          flutter build appbundle --release
          --flavor "$FLAVOR"
          -t "lib/main_$FLAVOR.dart"
          --dart-define-from-file="config/$FLAVOR.json"

      - name: Upload app bundle
        if: ${{ inputs.format == 'aab' || inputs.format == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ inputs.flavor }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
          if-no-files-found: error
