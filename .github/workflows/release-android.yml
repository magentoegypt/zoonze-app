name: Release · Android

# Builds a signed Play app bundle. Run from the Actions tab (choose a flavor).
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Flutter flavor"
        type: choice
        default: prod
        options: [prod, staging, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get

      # google-services.json is committed; only the keystore is injected. When
      # no keystore secret is set, this step is skipped and the Gradle config
      # falls back to the debug key, so the pipeline still builds (the AAB is
      # NOT Play-uploadable until the ANDROID_* secrets are added).
      - name: Write keystore + key.properties (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — building with the debug key (not Play-uploadable). Add the ANDROID_* secrets to produce a signed bundle."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build app bundle
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: >
          flutter build appbundle --release
          --flavor "$FLAVOR"
          -t "lib/main_$FLAVOR.dart"
          --dart-define-from-file="config/$FLAVOR.json"

      - uses: actions/upload-artifact@v4
        with:
          name: appbundle-${{ inputs.flavor }}
          path: build/app/outputs/bundle/${{ inputs.flavor }}Release/*.aab
          if-no-files-found: error
