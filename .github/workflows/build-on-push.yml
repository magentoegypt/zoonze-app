name: Build · main (APK + IPA)

# On every push to main, build installable artifacts:
#   - Android APK  → always (debug-signed until the ANDROID_* secrets are set)
#   - iOS IPA      → always on macOS. With the cert + profile in ios/signing/
#     (+ IOS_P12_PASSWORD secret) it's a signed ad-hoc IPA (OTA-installable on
#     registered devices); without them an UNSIGNED IPA (sideload/resign).
# Artifacts: apk-prod / ipa-prod (download from the run, e.g. for Diawi).
on:
  push:
    branches: [main]

# A newer push to main cancels an older in-progress run (saves macOS minutes).
concurrency:
  group: build-on-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    runs-on: ubuntu-latest
    # Gate the Android build on the iOS job: don't start the APK until the iOS
    # IPA job has finished. `ios` is continue-on-error, so this waits for iOS to
    # complete (pass or fail) rather than requiring it to pass.
    needs: ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Write keystore + key.properties (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret — building a debug-signed APK (installable for testing, not Play-uploadable)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (prod)
        run: >
          flutter build apk --release
          --flavor prod -t lib/main_prod.dart
          --dart-define-from-file=config/prod.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  # Always runs on macOS (uses macOS minutes). Produces a signed ad-hoc IPA when
  # ios/signing/ holds a .p12 + .mobileprovision and IOS_P12_PASSWORD is set;
  # otherwise an unsigned IPA. (See ios/signing/README.md — no fastlane match.)
  # Non-blocking until iOS builds reliably: a failure here does NOT fail the
  # run, so the Android APK stays the dependable artifact while iOS is brought
  # online. Flip continue-on-error off once iOS succeeds.
  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # firebase_messaging 16.4.1 -> firebase-ios-sdk 12.15 declares
      # swift-tools-version 6.1, which needs Xcode 16.3+. macos-14 tops out at
      # ~16.2 (Swift 6.0) and fails SPM resolution, so run on macos-15 and pin
      # the newest stable Xcode for a deterministic toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Flutter 3.44 enables Swift Package Manager by default and, during
      # `flutter pub get`, copies SPM-compatible plugins (firebase_messaging,
      # firebase_core) into build/ios/SourcePackages/ via rsync. On a fresh
      # checkout that parent dir doesn't exist and rsync won't create it, so
      # pub get fails with "Failed to copy plugin … mkdir … No such file or
      # directory". Pre-creating the dir lets the copy succeed. The project
      # genuinely uses SPM (Runner.xcodeproj references the generated package,
      # no Podfile), so disabling SPM is not an option.
      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get
      - name: Generate GraphQL typed Dart (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS IPA (signed ad-hoc from ios/signing certs, else unsigned)
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          if [ -n "$IOS_P12_PASSWORD" ] && ls ios/signing/*.p12 >/dev/null 2>&1; then
            # Signed ad-hoc IPA from the committed cert (.p12) + ad-hoc profile
            # in ios/signing/ — no fastlane match, no separate signing repo.
            # → build/ios/ipa/*.ipa (installs OTA on the profile's devices).
            bash tool/ios_sign_build.sh
          else
            echo "::warning::No iOS signing material — add ios/signing/*.p12 + *.mobileprovision and the IOS_P12_PASSWORD secret for a SIGNED ad-hoc IPA (see ios/signing/README.md). Building an UNSIGNED IPA (sideload/resign via AltStore / Sideloadly)."
            flutter build ios --release --no-codesign \
              -t lib/main_prod.dart \
              --dart-define-from-file=config/prod.json
            # `flutter build ios --no-codesign` emits Runner.app, not an IPA.
            # Package it into the standard IPA layout (Payload/Runner.app zip).
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
            ( cd build/ios/ipa && zip -qry Zoonze-unsigned.ipa Payload && rm -rf Payload )
            echo "Built unsigned IPA → build/ios/ipa/Zoonze-unsigned.ipa"
            ls -lh build/ios/ipa/*.ipa
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-prod
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
