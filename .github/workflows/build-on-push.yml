name: Build · main (APK + IPA)

# On every push to main, build installable artifacts:
#   - Android APK  → always (debug-signed until the ANDROID_* secrets are set)
#   - iOS          → always on macOS: ad-hoc IPA once the Apple signing secrets
#     exist (ipa-adhoc-prod artifact), otherwise an unsigned compile check (no
#     IPA, but verifies the iOS build). Runs every push (uses macOS minutes).
# Artifacts: apk-prod / ipa-adhoc-prod (download from the run, e.g. for Diawi).
on:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Write keystore + key.properties (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret — building a debug-signed APK (installable for testing, not Play-uploadable)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (prod)
        run: >
          flutter build apk --release
          --flavor prod -t lib/main_prod.dart
          --dart-define-from-file=config/prod.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  # Always runs on macOS (uses macOS minutes). Produces an ad-hoc IPA once the
  # Apple signing secrets exist; otherwise an unsigned compile check.
  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Flutter 3.44 enables Swift Package Manager by default and, during
      # `flutter pub get`, copies SPM-compatible plugins (firebase_messaging,
      # firebase_core) into build/ios/SourcePackages/ via rsync. On a fresh
      # checkout that parent dir doesn't exist and rsync won't create it, so
      # pub get fails with "Failed to copy plugin … mkdir … No such file or
      # directory". Pre-creating the dir lets the copy succeed. The project
      # genuinely uses SPM (Runner.xcodeproj references the generated package,
      # no Podfile), so disabling SPM is not an option.
      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get

      - name: Build iOS (ad-hoc IPA when signed, else unsigned compile)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            (cd ios && bundle install && bundle exec fastlane adhoc)
          else
            echo "::warning::No Apple signing secrets — building unsigned (compile check, no IPA). Add APP_STORE_CONNECT_*/MATCH_* secrets for an ad-hoc IPA artifact."
            flutter build ios --release --no-codesign \
              -t lib/main_prod.dart \
              --dart-define-from-file=config/prod.json
          fi

      - name: Upload ad-hoc IPA (when produced)
        uses: actions/upload-artifact@v4
        with:
          name: ipa-adhoc-prod
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
