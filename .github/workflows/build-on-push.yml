name: Build · main (APK + IPA)

# On every push to main, build installable artifacts:
#   - Android APK  → always (debug-signed until the ANDROID_* secrets are set)
#   - iOS IPA      → always on macOS. With the Apple signing secrets it's a
#     signed ad-hoc IPA (Diawi-installable on registered devices); without them
#     it's an UNSIGNED IPA (sideload/resign via AltStore or Sideloadly).
# Artifacts: apk-prod / ipa-prod (download from the run, e.g. for Diawi).
# Both builds are also auto-uploaded to AppsOnAir for OTA distribution once the
# APPSONAIR_* secrets are set (see the `appsonair` job + docs/decisions/ci.md).
on:
  push:
    branches: [main]

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Write keystore + key.properties (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::No keystore secret — building a debug-signed APK (installable for testing, not Play-uploadable)."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (prod)
        run: >
          flutter build apk --release
          --flavor prod -t lib/main_prod.dart
          --dart-define-from-file=config/prod.json

      - uses: actions/upload-artifact@v4
        with:
          name: apk-prod
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  # Always runs on macOS (uses macOS minutes). Produces an ad-hoc IPA once the
  # Apple signing secrets exist; otherwise an unsigned compile check.
  # Non-blocking until iOS builds reliably: a failure here does NOT fail the
  # run, so the Android APK stays the dependable artifact while iOS is brought
  # online. Flip continue-on-error off once iOS succeeds.
  ios:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # firebase_messaging 16.4.1 -> firebase-ios-sdk 12.15 declares
      # swift-tools-version 6.1, which needs Xcode 16.3+. macos-14 tops out at
      # ~16.2 (Swift 6.0) and fails SPM resolution, so run on macos-15 and pin
      # the newest stable Xcode for a deterministic toolchain.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Flutter 3.44 enables Swift Package Manager by default and, during
      # `flutter pub get`, copies SPM-compatible plugins (firebase_messaging,
      # firebase_core) into build/ios/SourcePackages/ via rsync. On a fresh
      # checkout that parent dir doesn't exist and rsync won't create it, so
      # pub get fails with "Failed to copy plugin … mkdir … No such file or
      # directory". Pre-creating the dir lets the copy succeed. The project
      # genuinely uses SPM (Runner.xcodeproj references the generated package,
      # no Podfile), so disabling SPM is not an option.
      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get

      - name: Build iOS IPA (signed ad-hoc when secrets exist, else unsigned)
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APP_STORE_CONNECT_KEY_ID" ]; then
            # Signed ad-hoc IPA via fastlane match → build/ios/ipa/*.ipa.
            # Installs OTA (AppsOnAir / Diawi) on devices registered in the
            # ad-hoc profile. Inject the Team ID into the export options so no
            # manual plist edit is needed (falls back to the committed value).
            if [ -n "$APPLE_TEAM_ID" ]; then
              sed -i '' "s/YOUR_TEAM_ID/$APPLE_TEAM_ID/g" \
                ios/ExportOptions-AdHoc.plist ios/ExportOptions.plist
            fi
            (cd ios && bundle install && bundle exec fastlane adhoc)
          else
            echo "::warning::No Apple signing secrets — producing an UNSIGNED IPA. It will NOT install via Diawi as-is; sideload/resign it with your own Apple ID (AltStore / Sideloadly), or add APP_STORE_CONNECT_*/MATCH_* secrets for a signed ad-hoc IPA."
            flutter build ios --release --no-codesign \
              -t lib/main_prod.dart \
              --dart-define-from-file=config/prod.json
            # `flutter build ios --no-codesign` emits Runner.app, not an IPA.
            # Package it into the standard IPA layout (Payload/Runner.app zip).
            mkdir -p build/ios/ipa/Payload
            cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
            ( cd build/ios/ipa && zip -qry Zoonze-unsigned.ipa Payload && rm -rf Payload )
            echo "Built unsigned IPA → build/ios/ipa/Zoonze-unsigned.ipa"
            ls -lh build/ios/ipa/*.ipa
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ipa-prod
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  # Publish both builds to AppsOnAir for OTA distribution via the official OTA
  # CLI (@appsonair/appsonair-cli), after both platform jobs (uploads whatever
  # was produced). No-op until the APPSONAIR_* secrets are set, so it never
  # breaks the build. NOTE: an unsigned IPA uploads but won't OTA-install — set
  # the Apple signing secrets so the ios job emits a *signed* ad-hoc IPA.
  appsonair:
    name: Upload to AppsOnAir
    needs: [android-apk, ios]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: apk-prod
          path: dist/apk
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ipa-prod
          path: dist/ipa
      - name: Upload builds to AppsOnAir (OTA CLI)
        env:
          APPSONAIR_CLI_TOKEN: ${{ secrets.APPSONAIR_CLI_TOKEN }}
          APPSONAIR_WORKSPACE_ID: ${{ secrets.APPSONAIR_WORKSPACE_ID }}
          APPSONAIR_APP_ID: ${{ secrets.APPSONAIR_APP_ID }}
          APPSONAIR_APP_NAME: Zoonze
        run: |
          if [ -z "$APPSONAIR_CLI_TOKEN" ]; then
            echo "::warning::AppsOnAir not configured — set APPSONAIR_CLI_TOKEN / APPSONAIR_WORKSPACE_ID / APPSONAIR_APP_ID secrets (see docs/decisions/ci.md). Skipping."
            exit 0
          fi
          bash tool/appsonair_upload.sh
