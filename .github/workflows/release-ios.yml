name: Release · iOS

# Builds the prod iOS app from a hosted macOS runner — no local Mac needed.
#   - testflight → uploads to TestFlight (App Store distribution)
#   - adhoc      → builds an ad-hoc .ipa artifact for Diawi / device install
# Requires the Apple secrets in docs/decisions/ci.md and a one-time
# `fastlane match appstore` (and `match adhoc` for the adhoc path) to seed
# signing. Ad-hoc installs only on devices whose UDIDs are registered in the
# Apple Developer portal and included in the ad-hoc profile.
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "testflight (App Store) or adhoc (Diawi / device install)"
        type: choice
        default: adhoc
        options: [adhoc, testflight]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # firebase-ios-sdk 12.15 (via firebase_messaging 16.4.1) needs Xcode
      # 16.3+ (swift-tools 6.1); macos-15 + latest stable Xcode satisfies it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      # Flutter 3.44's SPM plugin copy rsyncs into build/ios/SourcePackages/
      # during pub get; pre-create it so the copy doesn't fail on a fresh
      # checkout (see build-on-push.yml for the full note).
      - name: Pre-create SPM SourcePackages dir (flutter/flutter rsync workaround)
        run: mkdir -p build/ios/SourcePackages
      - run: flutter pub get

      - name: Build (fastlane)
        working-directory: ios
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT_BASE64 }}
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        run: |
          bundle install
          bundle exec fastlane ${{ inputs.distribution == 'testflight' && 'beta' || 'adhoc' }}

      # Ad-hoc only — publish the installable .ipa for Diawi.
      - name: Upload IPA (ad-hoc → Diawi)
        if: ${{ inputs.distribution == 'adhoc' }}
        uses: actions/upload-artifact@v4
        with:
          name: ipa-adhoc-prod
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
